# cargo-audit configuration.
#
# Ignored advisories must carry a justification and an unignore condition.
[advisories]
ignore = [
    # RUSTSEC-2026-0194 / RUSTSEC-2026-0195: quick-xml 0.39.x DoS issues
    # (quadratic dup-attribute check, unbounded namespace allocation).
    # quick-xml is reachable only through wayland-scanner, a proc-macro that
    # parses the *vendored* Wayland protocol XML at build time; it never
    # touches attacker-controlled input and is absent from the shipped binary.
    # Unignore when wayland-scanner releases with quick-xml >= 0.41
    # (https://github.com/Smithay/wayland-rs — check `cargo update -p
    # wayland-scanner && cargo tree -i quick-xml`).
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # RUSTSEC-2026-0370 / RUSTSEC-2026-0371 / RUSTSEC-2026-0372: zvariant,
    # zbus_names, and zvariant_derive 5.x/4.x unmaintained notices after those
    # crates were folded into zbus 6.0.0. atspi (including 0.30.0) still
    # depends on zbus 5.x and re-exports zbus 5 types across our AT-SPI boundary.
    # Unignore when atspi releases a version targeting zbus >= 6.0
    # (https://github.com/odilia-app/atspi — check `cargo info atspi`).
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]
